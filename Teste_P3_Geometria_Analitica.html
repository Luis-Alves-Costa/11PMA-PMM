<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P3 – Geometria Analítica · Teste por níveis · 11.º PMA/PMM</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1f2a37;--mu:#5b6670;--ac:#2563eb;--ok:#15803d;--ko:#b91c1c;--bd:#d5dbe1;--fg:#1f2a37;--grid:#e3e8ee;--ax:#5b6670}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#60a5fa;--ok:#4ade80;--ko:#f87171;--bd:#34404d;--fg:#e8edf2;--grid:#2a3540;--ax:#9aa6b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
main{padding:16px 16px 72px}
#wrap{max-width:680px;margin:auto}
#side{padding:0 16px 16px}
#side:empty{display:none}
@media(min-width:1000px){#wrap.dual{max-width:1140px;display:grid;grid-template-columns:minmax(0,700px) 400px;gap:8px;align-items:start}#wrap.dual #side{position:sticky;top:10px;padding:16px 16px 16px 0;max-height:calc(100vh - 20px);overflow:auto}}
.passo{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;margin:4px 0;font-size:.9rem}
.passo.cur{background:color-mix(in srgb,var(--ac) 14%,var(--card));border:1px solid var(--ac)}
.passo.ok{opacity:.6}.passo .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--bd)}
.passo.cur .n{background:var(--ac);color:#fff}.passo.ok .n{background:var(--ok);color:#fff}
#fbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:99px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.formul h3{font-size:1rem;margin:12px 0 4px}.formul p{margin:3px 0;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.45rem;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:13px 14px;margin:0 0 10px;min-height:50px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 18px;min-height:50px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.col{display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:10px}.nav .btn{flex:1}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0 14px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bd)}
.score{font-size:3rem;font-weight:800;color:var(--ac);line-height:1}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;white-space:nowrap}
.opt .m{font-size:.84em;white-space:normal}
h2 .m{white-space:normal}
.fig{display:block;width:100%;max-width:420px;height:auto;margin:6px auto 12px}
.r3d{user-select:none;-webkit-user-select:none}
.z2{position:relative;user-select:none;-webkit-user-select:none}.z2 .fig{touch-action:pan-y}.z2.zoomed .fig{cursor:grab}
.zb{position:absolute;right:4px;bottom:4px;display:flex;gap:4px;opacity:.75}.zb button{width:28px;height:28px;padding:0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px;line-height:1}
.viz .zb{right:2px;bottom:2px}.viz .zb button{width:24px;height:24px;font-size:13px}
.viz{float:right;width:46%;max-width:230px;margin:-4px 0 6px 10px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.viz .fig{margin:0 auto}.viz-tip{font-size:.7rem;text-align:center;color:var(--mu);margin:-4px 0 4px}
.ops-c .opt{padding:9px 12px;min-height:40px;margin-bottom:7px}
.ops-g{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ops-g .opt{margin:0}
#ops,.intro,#pist,#skp{clear:both}.ops-g{margin-bottom:10px}
.fig text{font:13px system-ui,sans-serif;fill:var(--fg)}
/* desenho progressivo das figuras */
svg.anim .dr{stroke-dasharray:1 1;stroke-dashoffset:1;animation:dr .75s ease-in-out forwards}
svg.anim .fd{opacity:0;animation:fd .7s ease forwards}
svg.anim .gr{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);animation:gr 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fd{to{opacity:1}}@keyframes gr{to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){svg.anim *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left}
.mc{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac)}
.ko{color:var(--ko)}
.dlg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.dlgc{background:var(--card);color:var(--tx);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.fb{border-left:6px solid var(--ko);padding:10px 12px;background:var(--bg);border-radius:8px;margin-top:6px}.fb.ok{border-left-color:var(--ok)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lvl div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;font-size:.9rem}
.lvl b{display:block;font-size:1.15rem}
footer{text-align:center;padding:1.2rem 1rem 2rem;font-size:.85rem;color:var(--mu)}
@media print{body{background:#fff;color:#000}.nop{display:none!important}.card{border:1px solid #999}}
/* ===== Cabeçalho institucional padrão (ESMP) ===== */
header.header-institucional,header.header-institucional *{box-sizing:border-box}
header.header-institucional{flex:0 0 auto;background:#fffefe;color:#333;border-bottom:4px solid #003b66;padding:1rem 1.5rem;box-shadow:0 3px 10px rgba(0,0,0,.08);font-family:Arial,Helvetica,sans-serif;line-height:1.6;text-align:left}
header.header-institucional .header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin:0 0 1rem}
header.header-institucional .header-logo{height:56px;width:auto;object-fit:contain}
header.header-institucional .header-center{text-align:center;flex-grow:1}
header.header-institucional .header-center h1{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#0b1b2b;margin:0 0 .45rem;padding:0}
header.header-institucional .header-info{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:.5rem 1.5rem;font-size:1rem;color:#222}
header.header-institucional .header-emblema{height:40px;width:auto;border-radius:4px}
header.header-institucional .header-curso{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;text-align:left}
header.header-institucional .header-curso .header-emblema{flex:none}
@media(max-width:700px){header.header-institucional .header-curso{gap:.45rem}header.header-institucional .header-curso .header-emblema{height:32px}}
header.header-institucional .header-rule{border:0;border-top:2px solid #000;margin:.9rem 0 0;height:0}
header.header-institucional .banner-ufcd{background-color:#fdeee6;text-align:center;padding:.5rem;font-weight:bold;color:#444;border-radius:4px;margin:.9rem 1.2rem 0;font-size:1.05rem}
@media(max-width:700px){header.header-institucional{padding:.6rem .8rem}header.header-institucional .header-top{flex-direction:row;justify-content:center;margin-bottom:.5rem}header.header-institucional .header-logo{height:34px}header.header-institucional .header-info{flex-direction:column;gap:.2rem;text-align:center}header.header-institucional .header-center h1{font-size:1.4rem}header.header-institucional .banner-ufcd{margin:.7rem 0 0}}

/* ===== Correção: logótipos alinhados à esquerda, ao centro e à direita (também no telemóvel) ===== */
header.header-institucional .header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;margin:0 0 1rem}
header.header-institucional .header-top>.header-logo{min-width:0;max-width:100%}
header.header-institucional .header-top>.header-logo:nth-child(1){justify-self:start}
header.header-institucional .header-top>.header-logo:nth-child(2){justify-self:center}
header.header-institucional .header-top>.header-logo:nth-child(3){justify-self:end}
@media(max-width:700px){header.header-institucional .header-top{gap:.4rem;margin-bottom:.5rem}header.header-institucional .header-logo{height:34px}}
@media(max-width:360px){header.header-institucional .header-logo{height:28px}}

/* variante Matemática · 11.º PMA/PMM: faixa azul-clara, como no cabeçalho em papel */
header.header-institucional .banner-ufcd{background-color:#dde8f5;color:#1f2a37;font-weight:600}
header.header-institucional .banner-ufcd .sc{font-variant:small-caps;letter-spacing:.02em}
header.header-institucional .header-center h1{font-family:Arial,Helvetica,sans-serif}

</style>
</head>

<script>
"use strict";
/* ================= Configuração ================= */
const PROF_EMAIL="luis.costa@esmp.pt";
const ENVIO_URL="https://script.google.com/macros/s/AKfycbx4-oWW2HY9ZP4wJasg-gC8lhvajGhL3scXtr6VkN6wNbNT5sIyIIyQD4feGKHUzalnng/exec";                         // recetor (Apps Script): lança a nota no Classroom e atualiza a folha de controlo      // destinatário do botão «Enviar ao professor»
const EXIGE_MAXIMO=false;                    // true = só pode passar de nível quem tiver 100 (ou 150) pontos
const MAX_NOVAS=2;                           // novas perguntas sobre o mesmo tema depois de um erro
const MAX_TROCAS=2;                          // perguntas que podem ser trocadas por um tema à escolha, em cada nível
const VALOR_TROCA=.5;
const GLOS_GRATIS=2;                         // pedidos de explicação gratuitos por nível
const PENAL_GLOSSARIO=.10, PENAL_GLOS_EXTRA=.01; // 3.º pedido: −10% no nível; cada pedido seguinte: −1% a mais
const CERTEZA_RISCO=.8;                      // acertar «a arriscar» vale 80%
const PENAL_CERTEZA=.10;                     // errar «com certeza» desconta 10% da cotação
const VALOR_JUST_ERRADA=.5;                  // pergunta em dois tempos: justificação errada → vale 50%
const DOIS_TEMPOS=[1,2];
const FACIL_OCT=.75;                         // ajuda «passar o sólido para o 1.º octante»: a pergunta passa a valer 75%                     // níveis (0 = Nível 1) com pergunta em dois tempos                        // fração da cotação que vale uma pergunta trocada (sem repetição)
const CREDITO=[1,.75,.5];                       // fração da cotação na 1.ª pergunta, na 1.ª nova e na 2.ª nova
const ESPERA_REVISAO_H=24;                   // horas até poder ver a revisão completa do teste
const CHAVE="GA-11PMA-PMM-2026-v12", SAL="GA-ESMP-PMA-PMM";

/* ================= Figuras ================= */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let ANIM=false; // true só quando a pergunta aparece pela primeira vez (a figura desenha-se)
function plano({pts=[],lns=[],R=5,rot,segs=[]}){
  if(rot)return zoom2(plano({pts,lns,R,segs}));
  const W=340,u=W/(2*R+1),o=W/2,X=x=>o+x*u,Y=y=>o-y*u,L=R+.5;
  let g=`<svg class="fig${ANIM?" anim":""}" viewBox="0 0 ${W} ${W}" role="img" aria-label="Referencial cartesiano">`;
  for(let k=-R;k<=R;k++)g+=`<line x1="${X(k)}" y1="${Y(-L)}" x2="${X(k)}" y2="${Y(L)}" stroke="var(--grid)" stroke-width=".7"/><line x1="${X(-L)}" y1="${Y(k)}" x2="${X(L)}" y2="${Y(k)}" stroke="var(--grid)" stroke-width=".7"/>`;
  g+=`<defs>${[0,1].map(i=>`<marker id="ar2${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0L10,5L0,10z" fill="${COR_EIXO[i]}"/></marker>`).join("")}</defs>`;
  g+=`<line x1="${X(-L)}" y1="${Y(0)}" x2="${X(L)}" y2="${Y(0)}" stroke="${COR_EIXO[0]}" stroke-width=".9" stroke-opacity=".8" marker-end="url(#ar20)"/><line x1="${X(0)}" y1="${Y(-L)}" x2="${X(0)}" y2="${Y(L)}" stroke="${COR_EIXO[1]}" stroke-width=".9" stroke-opacity=".8" marker-end="url(#ar21)"/>`;
  g+=`<text x="${X(L)-6}" y="${Y(0)+16}" style="font-style:italic;font-weight:500;fill:${COR_EIXO[0]}">x</text><text x="${X(0)+8}" y="${Y(L)+10}" style="font-style:italic;font-weight:500;fill:${COR_EIXO[1]}">y</text><text x="${X(0)-12}" y="${Y(0)+14}" style="font-size:10px;fill:var(--mu)">O</text>`;
  for(let k=-R;k<=R;k++)if(k){g+=`<text x="${X(k)-4}" y="${Y(0)+14}" style="font-size:9px;fill:${COR_EIXO[0]};opacity:.7">${N(k)}</text><text x="${X(0)-14}" y="${Y(k)+4}" style="font-size:9px;fill:${COR_EIXO[1]};opacity:.7">${N(k)}</text>`}
  lns.forEach(([x1,y1,x2,y2,l],n)=>{const sg=clipQ(x1,y1,x2,y2,L);if(!sg)return;const [a,b]=sg,c=COR_RETA[n%3];
    g+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${c}" stroke-width="1.2" stroke-opacity=".75" stroke-linecap="round" pathLength="1" class="dr" style="animation-delay:${.3+n*.8}s;animation-duration:1.6s"/>`;
    const e=[a[0]+(b[0]-a[0])*.88,a[1]+(b[1]-a[1])*.88];

  document.querySelectorAll(".r3d:not([data-on])").forEach(div=>{const o=SC[+div.dataset.sc];div.dataset.on=1;if(!o||o.rodar===false)return;
    let az=o.az0??AZ0,el=o.el0??EL0,bA=az,bE=el,ph=0,drag=null,ultimo=performance.now(),parado=performance.now()+(div.querySelector("svg.anim")?4200:600);
    const desenha=()=>{div.innerHTML=o.esf?renderEsf(o,az,el,false):render3d(o,az,el,false)};
    div.style.cursor="grab";
    div.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY,az,el];div.setPointerCapture(e.pointerId);div.style.cursor="grabbing"});
    div.addEventListener("pointermove",e=>{if(!drag)return;az=drag[2]-(e.clientX-drag[0])*.011;el=o.osc?Math.max(.35,Math.min(Math.PI/2,drag[3]+(e.clientY-drag[1])*.011)):Math.max(-1.2,Math.min(1.35,drag[3]+(e.clientY-drag[1])*.011));desenha()});
    const fim=()=>{if(drag){drag=null;bA=az;bE=el;ph=0;parado=performance.now()+2500;div.style.cursor="grab"}};
    div.addEventListener("pointerup",fim);div.addEventListener("pointercancel",fim);
    const passo=t=>{if(!document.body.contains(div))return;if(!drag&&t>parado&&t-ultimo>45){const d=(t-ultimo)/1000;if(o.osc){ph+=d;az=bA+.3*Math.sin(ph*.45);el=Math.min(Math.PI/2,bE+.12*Math.sin(ph*.31))}else az+=d*.22;desenha();ultimo=t}else if(drag||t<=parado)ultimo=t;requestAnimationFrame(passo)};
    requestAnimationFrame(passo);
  });
}
// pequena figura para perguntas só escritas
function vizFig(v){if(v.d2){const cs=[...(v.pts||[]).flatMap(p=>[p[0],p[1]]),...(v.lns||[]).flatMap(l=>l.slice(0,4))];return plano({pts:v.pts||[],lns:v.lns||[],segs:v.segs||[],R:Math.min(10,Math.max(5,...cs.map(c=>Math.ceil(Math.abs(c))+1))),rot:1})}
  const S={V:{},E:[],FC:[],mini:1,planos:[],setas:[],retas:[]};
  (v.pts||[]).forEach(([x,y,z,n])=>S.V[n]=[x,y,z]);(v.segs||[]).forEach(s=>S.E.push(s));
  const PL={xOy:[[-3,-3,0],[3,-3,0],[3,3,0],[-3,3,0]],xOz:[[-3,0,-3],[3,0,-3],[3,0,3],[-3,0,3]],yOz:[[0,-3,-3],[0,3,-3],[0,3,3],[0,-3,3]]};
  (v.planos||[]).forEach(p=>{if(typeof p==="string")S.planos.push(PL[p]);else{const [n,d]=p,nn=dot(n,n),P0=n.map(x=>x*d/nn),e=Math.abs(n[0])<.9*Math.sqrt(nn)?[1,0,0]:[0,1,0];
    let t1=cross(n,e),l1=Math.hypot(...t1);t1=t1.map(x=>x/l1*3);let t2=cross(n,t1),l2=Math.hypot(...t2);t2=t2.map(x=>x/l2*3);
    S.planos.push([[1,1],[-1,1],[-1,-1],[1,-1]].map(([a,b])=>P0.map((x,i)=>x+a*t1[i]+b*t2[i])))}});
  (v.setas||[]).forEach(s=>S.setas.push(s));(v.retas||[]).forEach(s=>S.retas.push(s));
  return espaco(S)}

/* ================= Matemática auxiliar ================= */
function RNG(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const riNZ=(r,a,b)=>{let v;do v=ri(r,a,b);while(v===0);return v};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const N=n=>(n<0?"−"+Math.abs(n):String(n));
const Fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}};
const fF=f=>f.d===1?N(f.n):(f.n<0?"−":"")+(Math.abs(f.n)===1&&f.d===2?"½":Math.abs(f.n)+"/"+f.d);
const P2=(x,y)=>`(${N(x)}, ${N(y)})`;
const P3=(p)=>`(${p.map(N).join(", ")})`;
const V3=(p)=>`(${p.map(N).join(",")})`;
const sub=(a,b)=>a.map((v,i)=>v-b[i]),add=(a,b)=>a.map((v,i)=>v+b[i]),mul=(a,k)=>a.map(v=>v*k);
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const isZ=v=>v.every(x=>x===0);
const simp=v=>{const g=v.reduce((s,x)=>gcd(s,x),0)||1;let w=v.map(x=>x/g);const f=w.find(x=>x!==0);return f<0?w.map(x=>-x):w};
// termo linear: lin([2,-1,0],["x","y","z"]) -> "2x − y"
function lin(c,v){let s="";c.forEach((a,i)=>{if(!a)return;const ab=Math.abs(a),t=(ab===1?"":ab)+v[i];s+=s?(a<0?" − ":" + ")+t:(a<0?"−":"")+t});return s||"0"}
// y = mx + b com m,b frações
function red(m,b){let s="y = ";if(m.n===0)return s+fF(b);const am=Math.abs(m.n)===m.d?"":(m.d===1?String(Math.abs(m.n)):(Math.abs(m.n)===1&&m.d===2?"½":"("+Math.abs(m.n)+"/"+m.d+")"));
  s+=(m.n<0?"−":"")+am+"x";if(b.n!==0)s+=(b.n<0?" − ":" + ")+fF({n:Math.abs(b.n),d:b.d});return s}
const plane=(n,d)=>`${lin(n,["x","y","z"])} = ${N(d)}`;
const vline=(P,u)=>`(x,y,z) = ${V3(P)} + k${V3(u)}, k∈ℝ`;
const sameLine=(P,u,Q,v)=>isZ(cross(u,v))&&isZ(cross(sub(Q,P),u));
const onPlane=(n,d,X)=>dot(n,X)===d;
const m=s=>`<span class="m">${s}</span>`;

/* ================= Sólidos para as figuras ================= */
function caixa(a,b,c){return{V:{O:[0,0,0],A:[a,0,0],B:[a,b,0],C:[0,b,0],D:[0,0,c],E:[a,0,c],F:[a,b,c],G:[0,b,c]},
  E:[["O","A"],["A","B"],["B","C"],["C","O"],["D","E"],["E","F"],["F","G"],["G","D"],["O","D"],["A","E"],["B","F"],["C","G"]],
  FC:[["O","A","B","C"],["D","E","F","G"],["O","A","E","D"],["C","B","F","G"],["O","C","G","D"],["A","B","F","E"]]}}
function cuboC(s){return{V:{A:[s,-s,-s],B:[s,s,-s],C:[-s,s,-s],D:[-s,-s,-s],E:[s,-s,s],F:[s,s,s],G:[-s,s,s],H:[-s,-s,s]},
  E:[["A","B"],["B","C"],["C","D"],["D","A"],["E","F"],["F","G"],["G","H"],["H","E"],["A","E"],["B","F"],["C","G"],["D","H"]],
  FC:[["A","B","C","D"],["E","F","G","H"],["A","B","F","E"],["B","C","G","F"],["C","D","H","G"],["D","A","E","H"]]}}
function piramide(s,h,centrada){const V=centrada?{A:[s,-s,0],B:[s,s,0],C:[-s,s,0],D:[-s,-s,0],V:[0,0,h]}:{O:[0,0,0],A:[2*s,0,0],B:[2*s,2*s,0],C:[0,2*s,0],V:[s,s,h]};
  const b=Object.keys(V).filter(k=>k!=="V");return{V,E:[[b[0],b[1]],[b[1],b[2]],[b[2],b[3]],[b[3],b[0]],...b.map(k=>[k,"V"])],FC:[b,...b.map((k,i)=>[k,b[(i+1)%4],"V"])]}}
function prismaT(a,b,h){return{V:{O:[0,0,0],A:[a,0,0],B:[0,b,0],D:[0,0,h],E:[a,0,h],F:[0,b,h]},
  E:[["O","A"],["A","B"],["B","O"],["D","E"],["E","F"],["F","D"],["O","D"],["A","E"],["B","F"]],
  FC:[["O","A","B"],["D","E","F"],["O","A","E","D"],["O","B","F","D"],["A","B","F","E"]]}}
function tetra(p,q,s){return{V:{O:[0,0,0],A:[p,0,0],B:[0,q,0],C:[0,0,s]},E:[["O","A"],["O","B"],["O","C"],["A","B"],["B","C"],["C","A"]],
  FC:[["O","A","B"],["O","B","C"],["O","C","A"],["A","B","C"]]}}
const fig3=(S,extra={})=>()=>espaco({...S,...extra});


/* ================= Sólidos fora do 1.º octante (Níveis 2 e 3) ================= */
let OCT1=false; // ajuda «passar o sólido para o 1.º octante»
const desloc=r=>{const T=[ri(r,-5,1),ri(r,-5,2),ri(r,-4,1)];if(T.every(x=>x>=0))T[0]=-3;return T};
function mover(S,T){const nz=T.some(x=>x),rn=k=>nz&&k==="O"?"P":k,V={};for(const k in S.V)V[rn(k)]=add(S.V[k],T);
  return{...S,V,E:S.E.map(e=>e.map(rn)),FC:(S.FC||[]).map(f=>f.map(rn)),rn}}
const ondeBox=T=>T.some(x=>x)?`arestas paralelas aos eixos e o vértice P no ponto ${P3(T)}`:"o vértice O na origem";

/* ================= Geradores =================
   Cada gerador recebe um gerador aleatório r e devolve:
   t (enunciado), f (figura, opcional), op (dados das opções; op[0] é a certa), fmt (dados→texto),
   ok (dados→verdadeiro se é resposta certa), x (explicação). */
const G1=[
// 1 · ler um ponto no referencial
r=>{const a=riNZ(r,-4,4),b=riNZ(r,-4,4),q=[riNZ(r,-4,4),riNZ(r,-4,4)];
  return{t:"Observa o referencial. Quais são as coordenadas do ponto P?",f:()=>plano({pts:[[a,b,"P"],[q[0],q[1],"Q"]],rot:1}),
  op:[[a,b],[b,a],[-a,b],[a,-b]],fmt:p=>P2(...p),ok:p=>p[0]===a&&p[1]===b,
  x:`A abcissa lê-se no eixo Ox (${N(a)}) e a ordenada no eixo Oy (${N(b)}). Logo P${P2(a,b)}.`}},
// 2 · equação reduzida da reta por dois pontos (gráfico)
r=>{const mm=pick(r,[-3,-2,-1,1,2,3]),b=ri(r,-3,3),x1=ri(r,-2,0),x2=x1+ri(r,1,2),y1=mm*x1+b,y2=mm*x2+b;
  if(Math.abs(y1)>5||Math.abs(y2)>5)return null;
  return{t:`A reta r passa nos pontos A${P2(x1,y1)} e B${P2(x2,y2)}. Qual é a equação reduzida de r?`,f:()=>plano({pts:[[x1,y1,"A"],[x2,y2,"B"]],lns:[[x1,y1,x2,y2,"r"]],rot:1}),
  op:[[mm,b],[-mm,b],[mm,y1],[b,mm],[mm,-b]],fmt:p=>m(red(Fr(p[0]),Fr(p[1]))),ok:p=>p[0]===mm&&p[1]===b,
  x:`Declive: m = (${N(y2)} − ${y1<0?"("+N(y1)+")":N(y1)}) ÷ (${N(x2)} − ${x1<0?"("+N(x1)+")":N(x1)}) = ${N(mm)}. Substituindo A em y = ${red(Fr(mm),Fr(0)).slice(4)} + b, obtém-se b = ${N(b)}. Logo ${red(Fr(mm),Fr(b))}.`}},
// 3 · equação reduzida dado o declive e um ponto
r=>{const mm=riNZ(r,-3,3),p=riNZ(r,-3,3),q=ri(r,-4,4),b=q-mm*p;
  return{viz:{d2:1,pts:[[p,q,"P"]]},t:`Qual é a equação reduzida da reta de declive ${N(mm)} que passa no ponto ${P2(p,q)}?`,
  op:[[mm,b],[mm,q],[mm,q+mm*p],[p,q],[mm,-b]],fmt:p=>m(red(Fr(p[0]),Fr(p[1]))),ok:x=>x[0]===mm&&x[1]===b,
  x:`Em y = ${N(mm)}x + b substitui-se o ponto: ${N(q)} = ${N(mm)} × ${p<0?"("+N(p)+")":N(p)} + b, logo b = ${N(b)}. A equação é ${red(Fr(mm),Fr(b))}.`}},
// 4 · retas paralelas aos eixos (no plano)
r=>{const a=riNZ(r,-5,5),b=riNZ(r,-5,5),ox=r()<.5;if(Math.abs(a)===Math.abs(b))return null;
  return{viz:{d2:1,pts:[[a,b,"P"]]},t:`Qual é a equação da reta paralela ao eixo ${ox?"Ox":"Oy"} que passa no ponto ${P2(a,b)}?`,
  op:ox?["y = "+N(b),"x = "+N(a),"y = "+N(a),"x = "+N(b)]:["x = "+N(a),"y = "+N(b),"x = "+N(b),"y = "+N(a)],fmt:m,ok:s=>s===(ox?"y = "+N(b):"x = "+N(a)),
  x:ox?`Uma reta paralela ao eixo Ox é horizontal: todos os pontos têm a mesma ordenada, ${N(b)}. Logo y = ${N(b)}.`:`Uma reta paralela ao eixo Oy é vertical: todos os pontos têm a mesma abcissa, ${N(a)}. Logo x = ${N(a)}.`}},
// 5 · coordenadas de um vértice de um paralelepípedo
r=>{const a=ri(r,2,6),b=ri(r,2,6),c=ri(r,2,5);const S=caixa(a,b,c),k=pick(r,["A","B","C","D","E","F","G"]),v=S.V[k];
  const nm=a===b&&b===c?`O cubo [OABCDEFG] tem aresta ${a}`:`O paralelepípedo [OABCDEFG] tem dimensões ${a} × ${b} × ${c} (comprimento em x, largura em y, altura em z)`;
  return{t:`${nm} e o vértice O na origem do referencial. Quais são as coordenadas do vértice ${k}?`,f:fig3(S,{cot:[["O","A",String(a)],["A","B",String(b)],["B","F",String(c)]]}),
  op:[v,[v[1],v[0],v[2]],[v[0],v[2],v[1]],[v[2],v[1],v[0]],...Object.values(S.V)],fmt:P3,ok:p=>p.join()===v.join(),
  x:`O vértice ${k} está a ${N(v[0])} unidades na direção de x, ${N(v[1])} na de y e ${N(v[2])} na de z. Logo ${k}${P3(v)}.`}},
// 6 · equação do plano de uma face (paralela a um plano coordenado)
r=>{const a=ri(r,2,6),b=ri(r,2,6),c=ri(r,2,5),S=caixa(a,b,c);
  const F=pick(r,[["[ABFE]","x",a],["[CBFG]","y",b],["[DEFG]","z",c],["[OCGD]","x",0],["[OAED]","y",0],["[OABC]","z",0]]);
  const ops=[`${F[1]} = ${F[2]}`,...["x","y","z"].filter(v=>v!==F[1]).map(v=>`${v} = ${F[2]}`),...[[ "x",a],["y",b],["z",c]].filter(p=>p[0]!==F[1]).map(p=>`${p[0]} = ${p[1]}`),`${F[1]} = ${F[2]===0?(F[1]=="x"?a:F[1]=="y"?b:c):0}`];
  return{t:`O paralelepípedo [OABCDEFG] tem dimensões ${a} × ${b} × ${c} e o vértice O na origem. Qual é a equação do plano que contém a face ${F[0]}?`,f:fig3(S,{cot:[["O","A",String(a)],["A","B",String(b)],["B","F",String(c)]]}),

// 7 · plano paralelo a um plano coordenado que passa num ponto
r=>{const p=[riNZ(r,-5,5),riNZ(r,-5,5),riNZ(r,-5,5)];if(new Set(p.map(Math.abs)).size<3)return null;const j=ri(r,0,2),v="xyz"[j],pl=["yOz","xOz","xOy"][j];

  x:`Um plano paralelo a ${pl} tem todos os pontos com a mesma coordenada ${v}. Como passa em ${P3(p)}, essa coordenada é ${N(p[j])}: ${v} = ${N(p[j])}.`}},
// 8 · onde está um ponto: plano coordenado ou eixo
r=>{const p=[riNZ(r,-6,6),riNZ(r,-6,6),riNZ(r,-6,6)],z=ri(r,0,2),eixo=r()<.4;let L;
  if(eixo){p[z]=p[z];[0,1,2].filter(i=>i!==z).forEach(i=>p[i]=0);L="eixo O"+"xyz"[z]}else{p[z]=0;L="plano "+["yOz","xOz","xOy"][z]}

  x:eixo?`O ponto tem duas coordenadas nulas e só a coordenada ${"xyz"[z]} diferente de zero: está no ${L}.`:`A coordenada ${"xyz"[z]} é zero, por isso o ponto pertence ao ${L} (de equação ${"xyz"[z]} = 0).`}},
// 9 · projeção ortogonal num plano coordenado
r=>{const p=[riNZ(r,-5,5),riNZ(r,-5,5),riNZ(r,-5,5)],j=ri(r,0,2),pl=["yOz","xOz","xOy"][j],q=p.map((v,i)=>i===j?0:v);
  return{viz:{pts:[[...p,"P"]],planos:[pl]},t:`Quais são as coordenadas da projeção ortogonal do ponto P${P3(p)} sobre o plano ${pl}?`,
  op:[q,...[0,1,2].filter(i=>i!==j).map(i=>p.map((v,k)=>k===i?0:v)),p.map((v,k)=>k===j?v:0),p.map((v,k)=>k===j?-v:v)],fmt:P3,ok:x=>x.join()===q.join(),
  x:`Projetar sobre ${pl} é anular a coordenada ${"xyz"[j]} e manter as outras: ${P3(q)}.`}},
// 10 · ponto que pertence a uma reta do plano
r=>{const mm=riNZ(r,-3,3),b=ri(r,-4,4),x0=riNZ(r,-3,3),y0=mm*x0+b,on=([x,y])=>y===mm*x+b;
  return{viz:{d2:1,lns:[[0,b,1,mm+b,""]]},t:`Qual dos seguintes pontos pertence à reta de equação ${m(red(Fr(mm),Fr(b)))}?`,
  op:[[x0,y0],[x0,y0+1],[y0,x0],[x0,-y0],[-x0,y0],[x0+1,y0]],fmt:p=>P2(...p),ok:on,

];

const G2=[

r=>{const A=[ri(r,-6,6),ri(r,-6,6)],B=[A[0]+2*ri(r,-4,4),A[1]+2*ri(r,-4,4)];if(A[0]===B[0]||A[1]===B[1])return null;const M=[(A[0]+B[0])/2,(A[1]+B[1])/2];

function gerar(l,k,seed,oct1){
  OCT1=!!oct1;try{return gerar_(l,k,seed)}finally{OCT1=false}
}
function gerar_(l,k,seed){
  const r=RNG(seed);
  for(let tent=0;tent<400;tent++){
    const q=GEN[l][k](r);if(!q)continue;
    if(q.tipo==="marcar")return{...q,o:[q.sol],ordem:[0]};
    if(q.tipo==="ordenar"){let ord;do ord=sh(q.passos.map((_,i)=>i),r);while(ord.every((v,i)=>v===i));return{...q,o:[q.sol],ordem:ord}}
    const vis=new Set(),op=[];
    for(const o of q.op){const s=q.fmt(o);if(vis.has(s))continue;vis.add(s);op.push(o)}
    if(!q.ok(op[0]))continue;
    const errs=op.slice(1).filter(o=>!q.ok(o));
    if(errs.length<3)continue;
    const o=[q.fmt(op[0]),...sh(errs,r).slice(0,3).map(q.fmt)];
    const ordem=q.tipo==="erro"?[0,1,2,3].sort((x,y)=>+o[x].slice(6)-+o[y].slice(6)):sh([0,1,2,3],r);
    return{t:q.t,f:q.f,o,x:q.x,ordem,tipo:q.tipo||"mc",oct:!!q.oct,viz:q.viz};
  }
  throw new Error("gerador "+l+"/"+k);
}

function introVet(q){
  const txt=q.t+q.o.join(" ");if(!/\(x,y,z\) =/.test(txt))return "";
  return `<details open class="intro" style="border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:.92rem"><summary style="cursor:pointer;font-weight:600">O que é uma equação vetorial da reta?</summary>
  <p style="margin:6px 0 0">Uma reta fica definida por um ponto P e por um <b>vetor diretor</b> v, que indica a sua direção. Todos os pontos da reta escrevem-se na forma <span class="m">(x,y,z) = P + k·v</span>, com k um número real: cada valor de k dá um ponto da reta. Por exemplo, em <span class="m">(x,y,z) = (1,2,0) + k(2,−1,3)</span>, com k = 1 obtém-se o ponto (3, 1, 3). Se a reta passa em A e B, um vetor diretor é <span class="m">B − A</span>; qualquer múltiplo dele (por exemplo, o dobro ou o simétrico) também serve.</p></details>`;
}
const GLOS=[
 ["Referencial","referencial","Sistema de eixos perpendiculares que se cruzam na origem O e permitem localizar pontos através das suas coordenadas."],

 ["Equação vetorial da reta","\\(x,y,z\\) =","Escrita (x,y,z) = P + k·v: P é um ponto da reta, v um vetor diretor e k percorre os números reais."],

  const ok=hsh(SAL+JSON.stringify(d))===h&&Math.abs(tot-d.p)<1e-9,v=tot/10,ab=revisaoAberta(d.f);
  app.innerHTML=`<div class="card" style="text-align:center"><span class="tag">Comprovativo do teste P3</span>
  <h2 style="margin:10px 0 4px">${esc(d.n)}</h2><div class="mu">${esc(d.t)} · ${new Date(d.f).toLocaleString("pt-PT")}</div>
  <div class="score" style="margin-top:10px">${fm(v)}<span class="mu" style="font-size:1.3rem"> valores</span></div><div class="mc">${mencao(v)}</div>
  <div class="mu" style="margin-top:8px">${fm(tot)} de 200 pontos · código ${esc(d.i)}</div>
  <div class="lvl">${[0,1,2].map(l=>`<div>${LV[l].nome}<b>${pts[l]===null?"—":fm(pts[l])+"/"+LV[l].pts*10}</b></div>`).join("")}</div>
  ${listaTrocas(its).length?`<p class="mu" style="margin:6px 0 0">Perguntas trocadas (valem metade): ${listaTrocas(its).join("; ")}</p>`:""}
  <p style="font-weight:700;margin:10px 0 0;color:${ok?"var(--ok)":"var(--ko)"}">${ok?"✔ Comprovativo íntegro (código "+h+")":"⚠ Atenção: os dados deste comprovativo foram alterados"}</p></div>
  <div class="card nop col"><button class="btn sec" id="rv" ${ab?"":"disabled"}>${ab?"Ver o teste completo":"Revisão completa disponível a partir de "+quando(d.f)}</button><button class="btn sec" onclick="print()">Imprimir / guardar PDF</button></div>`;
  if(ab)rv.onclick=()=>{window.GG=gg;revisao(its,false,xts)};
}

new MutationObserver(()=>{lado();ativar3D();ativarZoom()}).observe(document.getElementById("app"),{childList:true});
document.getElementById("fbtn").onclick=()=>{FORM_ABERTO=!FORM_ABERTO;if(S){S.form=(S.form||0)+(FORM_ABERTO?1:0);if(FORM_ABERTO)regista("formulario",`Abriu o Formulário${S.it&&S.it[0]?" ("+onde()+")":""}`);save()}lado();if(FORM_ABERTO&&innerWidth<1000)document.getElementById("side").lastElementChild.scrollIntoView({behavior:"smooth",block:"start"})};
/* ================= Arranque =================
   O progresso fica guardado neste telemóvel: recarregar a página retoma o teste (não recomeça).
   Para limpar (professor): abrir o endereço com #reiniciar no fim. */
if(location.hash==="#reiniciar"){try{localStorage.removeItem(CHAVE)}catch(e){}history.replaceState(null,"",location.pathname)}
S=load();
if(S&&!S.it)S=null; // versão antiga guardada
if(S&&!S.xt){S.xt=[[],[],[]];S.usado={};S.modo=null;S.fila=[];S.fp=0}
if(S&&!S.gl)S.gl=[0,0,0];
if(location.hash.startsWith("#r="))verComp(location.hash.slice(3));
else if(!S)home();else if(S.modo)pergunta();else if(S.fim)final();else if(S.it[S.lv]&&S.i<10)pergunta();else fimNivel();
